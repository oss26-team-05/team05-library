[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "team05"
version = "0.1.0"
description = "Low-light and adverse weather image preprocessing library (ClearVision)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Team 05" }]
dependencies = [
    "Pillow>=10",
    "numpy>=1.26",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/oss26-team-05/team05-library"
Documentation = "https://oss26-team-05.github.io/team05-library/"
Issues = "https://github.com/oss26-team-05/team05-library/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/team05"]